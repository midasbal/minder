[package]
name = "minder"
description = "Policy firewall between an AI agent and funds"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Adds an owner-only method that records spend directly, so the sliding window
# can be exercised before the reservation lifecycle exists. Never enable it for
# a deployed build.
test-helpers = []

[dependencies]
# `unstable` is what exposes `env::ecrecover`, used to check that a signature
# really recovers to this contract's own EVM address. The version is pinned
# exactly, so an "unstable" API cannot change under us. The other things the
# feature adds (`store::TreeMap`, `near_sys` as `sys`) are unused.
near-sdk = { version = "=5.29.1", features = ["unstable"] }

[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["unit-testing"] }
near-workspaces = "=0.23.0"
tokio = { version = "1", features = ["full"] }
# Model-based invariant harness (src/model_tests). Dev-only.
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
