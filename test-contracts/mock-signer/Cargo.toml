[package]
name = "mock-signer"
description = "Test double for the Chain Signatures contract: records sign requests, returns a fixed signature, a bad one, or fails"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.29.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
